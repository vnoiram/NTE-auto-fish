name: Release and Build

on:
  push:
    branches: [ "main", "fix/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      app_name:
        description: "Application display name"
        required: false
        default: "NTE Auto-Fish"
        type: string
      icon_path:
        description: "Repository-relative .ico path"
        required: false
        default: "assets/icons/app.ico"
        type: string
      build_id:
        description: "Optional unique build ID; blank generates one"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          release-type: simple

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Install dependencies and security tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit bandit

      - name: Run dependency vulnerability audit
        run: pip-audit -r requirements.txt --strict

      - name: Run static security scan
        run: bandit -q -r . -x tests,tools

  build:
    runs-on: windows-latest
    if: |
      always() &&
      needs.security.result == 'success' &&
      (
        github.event_name != 'push' ||
        github.ref != 'refs/heads/main' ||
        needs.release-please.outputs.release_created == 'true'
      )
    needs: [release-please, security]
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: "3.14"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Run tests
      run: python -m unittest discover -s tests -t . -v

    - name: Build GUI (single EXE)
      shell: bash
      env:
        APP_NAME: ${{ inputs.app_name || 'NTE Auto-Fish' }}
        ICON_PATH: ${{ inputs.icon_path || 'assets/icons/app.ico' }}
        BUILD_ID: ${{ inputs.build_id || '' }}
      run: |
        python scripts/build_windows.py \
          --app-name "$APP_NAME" \
          --icon "$ICON_PATH" \
          --build-id "$BUILD_ID" \
          --dist-dir dist \
          --github-env "$GITHUB_ENV"

    - name: Check OCR and XLSX dependencies are available to the bundler
      shell: bash
      run: |
        python -c "import openpyxl, xml.etree.ElementTree, rapidocr"
        python - <<'PY'
        import importlib.util, pathlib
        pkg = importlib.util.find_spec("rapidocr")
        root = pathlib.Path(pkg.submodule_search_locations[0])
        assert (root / "config.yaml").exists(), "rapidocr config.yaml missing"
        assert list((root / "models").glob("*.onnx")), "rapidocr models missing"
        PY

    - name: Package CLI source
      shell: pwsh
      run: |
        $version = Get-Content version.txt -Raw
        $version = $version.Trim()
        $cliFilename = "NTE-Auto-Fish-v$version-CLI.zip"
        echo "CLI_FILENAME=$cliFilename" >> $env:GITHUB_ENV
        
        New-Item -ItemType Directory -Force -Path dist/cli-package/modules, dist/cli-package/templates | Out-Null
        Copy-Item main.py, config.py, requirements.txt, run.bat, version.txt dist/cli-package/
        Copy-Item modules/* dist/cli-package/modules/
        Copy-Item templates/* dist/cli-package/templates/
        Compress-Archive -Path dist/cli-package/* -DestinationPath "dist/$cliFilename"

    - name: Upload GUI Artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: NTE-Auto-Fish-GUI-Windows
        path: dist/${{ env.FILENAME }}

    - name: Upload CLI Artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: NTE-Auto-Fish-CLI-Windows
        path: dist/${{ env.CLI_FILENAME }}

    - name: Upload Release Artifacts
      if: needs.release-please.outputs.release_created == 'true'
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      with:
        tag_name: ${{ needs.release-please.outputs.tag_name }}
        files: |
          dist/${{ env.FILENAME }}
          dist/${{ env.CLI_FILENAME }}
